name: Sync Upstream Newest Tag
on:
  schedule:
    # Runs every night at 3:15 AM UTC (Avoids top-of-the-hour high traffic delays)
    - cron: '15 3 * * *'
  workflow_dispatch: # Allows you to trigger this action manually from the UI anytime

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Essential permission to push updates to your repository

    steps:
      - name: Checkout Forked Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history so git can trace upstream branches and tags

      - name: Disable Git LFS auto-sync
        run: |
          # openpilot ships a .lfsconfig pointing at comma's private GitLab LFS
          # server (with an ssh:// push URL). We don't want Actions runners
          # trying to smudge/push real LFS content there - that's what causes
          # "Host key verification failed" on push. Uninstalling LFS locally
          # keeps LFS-tracked files as plain pointer text, which is all we
          # need to detect and sync upstream changes.
          git lfs uninstall --local

      - name: Fetch Upstream Updates and Tags
        run: |
          UPSTREAM_URL="https://github.com/commaai/openpilot"

          echo "Connecting to hardcoded upstream URL: $UPSTREAM_URL"
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream --tags

      - name: Process Tag and Sync Seamlessly
        run: |
          # 1. Get the newest upstream semantic version tag
          NEWEST_TAG=$(git tag -l --sort=-v:refname | head -n 1)
          if [ -z "$NEWEST_TAG" ]; then
            echo "No tags found in the upstream repository."
            exit 1
          fi
          echo "The newest upstream tag is: $NEWEST_TAG"

          # 2. Set up Git author signature profile for clean execution
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Nightly Sync"

          # 3. Create or switch into your tracking branch locally
          git checkout -B newest_release

          # 4. Overwrite local workspace files with the targeted upstream tag files
          # This replaces the content of the files without blowing up your git branch commit tree history
          git checkout "tags/$NEWEST_TAG" -- .

          # 5. Check if there are any core content file differences
          if git diff --quiet && git diff --staged --quiet; then
            echo "No updates detected. Your branch is completely caught up with tag $NEWEST_TAG."
          else
            echo "New software updates detected from upstream tag $NEWEST_TAG! Committing files..."
            git add -A
            git commit -m "Automated Sync: Updated openpilot files to match upstream tag $NEWEST_TAG"
            git push origin newest_release
          fi
